<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Zone boxes -->
  <rect x="20" y="60" width="420" height="470" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="230" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">CLIENT (Browser) — Zero Knowledge</text>

  <rect x="460" y="60" width="420" height="470" rx="10" fill="#fdf2f2" stroke="#d6543b" stroke-width="1.5"/>
  <text x="670" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">SERVER — Never Sees Plaintext</text>

  <!-- Master Password -->
  <rect x="120" y="120" width="220" height="50" rx="8" fill="#ffffff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="230" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Master Password</text>

  <!-- PBKDF2 -->
  <rect x="90" y="205" width="280" height="60" rx="8" fill="#ffffff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="230" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">PBKDF2</text>
  <text x="230" y="248" text-anchor="middle" font-size="12" fill="#374151">Salt + 100,000 iterations</text>

  <!-- Auth Key -->
  <rect x="60" y="300" width="150" height="55" rx="8" fill="#e0e7ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="135" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Auth Key</text>
  <text x="135" y="340" text-anchor="middle" font-size="10" fill="#374151">sent to server</text>

  <!-- Encryption Key -->
  <rect x="250" y="300" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="325" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Encryption Key</text>
  <text x="325" y="340" text-anchor="middle" font-size="10" fill="#374151">NEVER leaves browser</text>

  <!-- AES-GCM box -->
  <rect x="130" y="395" width="250" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">AES-256-GCM</text>
  <text x="255" y="438" text-anchor="middle" font-size="12" fill="#374151">encrypt / decrypt vault entries</text>

  <!-- Encrypted blob -->
  <rect x="140" y="480" width="230" height="45" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="255" y="507" text-anchor="middle" font-size="12" fill="#374151">Encrypted Blob (gibberish)</text>

  <!-- Server: Auth check -->
  <rect x="560" y="300" width="220" height="60" rx="8" fill="#ffffff" stroke="#d6543b" stroke-width="2"/>
  <text x="670" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Verify Auth Key</text>
  <text x="670" y="343" text-anchor="middle" font-size="12" fill="#374151">issues session (JWT)</text>

  <!-- Server: Storage -->
  <rect x="560" y="480" width="220" height="45" rx="8" fill="#ffffff" stroke="#d6543b" stroke-width="2"/>
  <text x="670" y="507" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Stores Encrypted Blob</text>
  <text x="670" y="522" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">(can't read it — no key)</text>

  <!-- Arrows -->
  <line x1="230" y1="170" x2="230" y2="205" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="265" x2="150" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="265" x2="310" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auth key -> server -->
  <path d="M210,325 C 380,325 480,330 560,330" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Encryption key -> AES box -->
  <line x1="325" y1="355" x2="290" y2="395" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AES box -> blob -->
  <line x1="255" y1="455" x2="255" y2="480" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blob -> server storage -->
  <path d="M370,502 C 460,502 480,502 560,502" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="450" y="550" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">One password, two unrelated keys — only one of them ever touches the server.</text>
</svg>
